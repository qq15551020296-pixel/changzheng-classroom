const STORAGE_KEY='cz18_student_progress_v1';
let studentState={completed:[],answers:{},journal:[]};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');studentState={...studentState,...saved}}catch(e){}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(studentState))}catch(e){};updateProgress()}
function updateProgress(){let n=studentState.completed.length;$('#progressBar').style.width=(n/chapters.length*100)+'%';$('#progressText').textContent=`${n} / ${chapters.length}`;$('#status').textContent=`关卡 ${chapters[current].num} / ${chapters[current].name} · 已完成 ${n}/6`}
function markComplete(){if(!studentState.completed.includes(chapters[current].id))studentState.completed.push(chapters[current].id);persist();toast('本关已记录到行军手记')}
function showJournal(){const entries=studentState.journal.slice(-12).reverse();let body=`<div class="eyebrow">FIELD JOURNAL / 学习记录</div><h2>行军手记</h2><p>学习进度保存在当前浏览器中；清理浏览器数据后可能丢失。</p><div class="facts"><div class="fact"><b>${studentState.completed.length}/6</b><span>完成关卡</span></div><div class="fact"><b>${Object.keys(studentState.answers).length}</b><span>答题记录</span></div><div class="fact"><b>${entries.length}</b><span>最近记录</span></div></div><div class="subhead">关卡进度</div>${chapters.map(c=>`<div class="journalEntry"><b>${studentState.completed.includes(c.id)?'✓':'○'} ${c.name}</b><p class="small">${studentState.completed.includes(c.id)?'已完成学习任务':'尚未完成任务'}</p></div>`).join('')}<div class="subhead">最近学习记录</div>${entries.length?entries.map(e=>`<div class="journalEntry"><b>${e.title}</b><p>${e.text}</p><p class="small">${e.time}</p></div>`).join(''):'<p>完成关卡任务后，记录会显示在这里。</p>'}<button class="btn" id="resetProgress">重置本机学习进度</button>`;$('#pc').innerHTML=body;$('#wrap').classList.add('open');$('#resetProgress').onclick=()=>{if(confirm('确定清除本机学习进度吗？')){studentState={completed:[],answers:{},journal:[]};persist();showJournal()}}}
function addJournal(title,text){studentState.journal.push({title,text,time:new Date().toLocaleString()});if(studentState.journal.length>40)studentState.journal=studentState.journal.slice(-40);persist()}

function showPanel(type){let c=chapters[current],body='';if(type==='brief')body=`<div class="eyebrow">SCENE NOTE / 场景说明</div><h2>${c.name}</h2><span class="tag">程序生成的教学模拟</span><span class="tag">非历史现场复原</span><p>${c.desc}</p><p>地形、建筑、天气和道具用于帮助建立空间印象，不是测绘级地形，也不能作为历史证据。请先观察，再阅读档案和完成任务。</p><div class="facts"><div class="fact"><b>观察</b><span>地形与空间</span></div><div class="fact"><b>阅读</b><span>历史摘要与来源</span></div><div class="fact"><b>判断</b><span>史实还是模拟</span></div></div>`;
if(type==='archive'){const d=learningData[c.id];body=`<div class="eyebrow">ARCHIVE / 历史档案</div><h2>${c.name}</h2><span class="tag">可核验史实导读</span><span class="tag">场景为程序模拟</span><div class="sourceCard"><b>时间锚点</b><p>${d.date}</p><b>核心内容</b><p>${d.core}</p></div><div class="subhead">本关要点</div>${d.learn.map((x,i)=>`<div class="journalEntry"><b>0${i+1}</b><p>${x}</p></div>`).join('')}<div class="subhead">建议核验来源</div><p>${d.source}</p><p><b>史料记录模板：</b>作者/机构｜标题｜出版/发布日期｜页码或网址｜你引用的具体观点。</p><p class="small">此处为学习导读和来源线索，不冒充逐字史料。请打开 <a style="color:#e7bd73" href="./sources.html" target="_blank">史料与来源说明</a> 继续核验。</p><button class="btn primary" id="archiveDone">已阅读，记入手记</button>`}
if(type==='task'){const d=learningData[c.id];body=`<div class="eyebrow">MISSION / 本关学习任务</div><h2>${c.name} · 任务简报</h2><span class="tag">学生自主体验</span><p>${d.task}</p><div class="sourceCard"><b>判断题</b><p>${d.question}</p><div class="task">${d.options.map((x,i)=>`<button data-q="${i}">${i+1}. ${x}</button>`).join('')}</div><div id="result"></div></div><div class="subhead">完成标准</div><p>完成判断题，并在行军手记中留下本关的史实/模拟辨析记录。答对后可标记本关完成。</p>`}
$('#pc').innerHTML=body;$('#wrap').classList.add('open')}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));$('#archiveBtn').onclick=()=>showPanel('archive');$('#close').onclick=()=>$('#wrap').classList.remove('open');$('#wrap').onclick=e=>{if(e.target===$('#wrap'))$('#wrap').classList.remove('open')};$('#pc').onclick=e=>{if(e.target.id==='archiveDone'){addJournal(chapters[current].name+'：史料阅读','已阅读本关档案摘要与来源核验建议。');toast('阅读记录已保存');$('#wrap').classList.remove('open');return}if(e.target.dataset.q!==undefined){const d=learningData[chapters[current].id],chosen=Number(e.target.dataset.q),ok=chosen===d.answer;document.querySelectorAll('[data-q]').forEach(b=>{b.disabled=true;if(Number(b.dataset.q)===d.answer)b.classList.add('correct');if(b===e.target&&!ok)b.classList.add('wrong')});studentState.answers[chapters[current].id]={chosen,correct:ok};const msg=ok?'✓ 判断正确。请继续完成观察任务。':'↻ 还差一点。绿色选项为更符合史料规范的判断。';$('#result').innerHTML=`<p>${msg}</p><p>${d.core}</p>`;addJournal(chapters[current].name+'：任务判断',msg+' '+d.core);if(ok){markComplete()}return}if(e.target.dataset.a){$('#result').innerHTML+=`<p>${e.target.dataset.a==='1'?'✓ 判断正确：视觉体验不能替代史料证据。':'↻ 再想一想：请把教学模拟和史实区分开。'}</p>`}};$('#nextBtn').onclick=()=>load(current===5?0:current+1);
const colors=[['#b9d4d6','#536d76'],['#a7b7a0','#455b49'],['#91aeb0','#354c50'],['#99aaa3','#364742'],['#c1a37d','#5d4333'],['#c2b18d','#545b43']];$('#mapgrid').innerHTML=chapters.map((c,i)=>`<button class="level" style="--a:${colors[i][0]};--b:${colors[i][1]}" data-i="${i}"><small>CHAPTER ${c.num}</small><strong>${c.name}</strong><span>${c.desc}</span></button>`).join('');$('#mapBtn').onclick=()=>$('#map').classList.add('open');$('#closeMap').onclick=()=>$('#map').classList.remove('open');$('#mapgrid').onclick=e=>{let b=e.target.closest('[data-i]');if(b){load(+b.dataset.i);$('#map').classList.remove('open')}};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)};renderer.domElement.onpointermove=e=>{if(drag){yaw-=(e.clientX-lx)*.003;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-ly)*.0024,-.7,.45);lx=e.clientX;ly=e.clientY}};renderer.domElement.onpointerup=e=>{drag=false;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);if(ray.intersectObjects(markers,true).length)showPanel('archive')};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'){$('#wrap').classList.remove('open');$('#map').classList.remove('open')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let je=$('#joy'),nub=$('#nub'),ja=false;je.onpointerdown=e=>{ja=true;je.setPointerCapture(e.pointerId);uj(e)};je.onpointermove=e=>{if(ja)uj(e)};['pointerup','pointercancel'].forEach(ev=>je.addEventListener(ev,()=>{ja=false;joy={x:0,y:0};nub.style.transform='translate(0,0)'}));function uj(e){let r=je.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),s=Math.min(1,42/(l||1));joy={x:x/42*s,y:y/42*s};nub.style.transform=`translate(${joy.x*31}px,${joy.y*31}px)`}
let prev=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min(.04,(now-prev)/1000);prev=now;markers.forEach((m,i)=>{m.rotation.y+=dt*.3;m.children[0].position.y=Math.sin(now*.0014+i)*.12});if(particles){let a=particles.geometry.attributes.position.array;for(let i=0;i<a.length/3;i++){a[i*3+1]-=dt*(current===0?3:current===1?1:.4);if(a[i*3+1]<-8)a[i*3+1]=30}particles.geometry.attributes.position.needsUpdate=true}foam.forEach(f=>{f.position.z+=dt*4;if(f.position.z>100)f.position.z=-100});if(move){let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;camera.position.x+=(Math.cos(yaw)*s+Math.sin(yaw)*f)*7*dt;camera.position.z+=(Math.sin(yaw)*s-Math.cos(yaw)*f)*7*dt;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-28,28);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-35,30)}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}animate(performance.now());
$('#hint').onclick=()=>showPanel('brief');$('#title').ondblclick=()=>{move=!move;toast(move?'移动模式已开启':'移动模式已关闭')};
