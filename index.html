{id:'snow',n:'翻越雪山',en:'CHAPTER 01 · MOUNTAIN PASS',d:'风雪遮住前路。观察山势与行军路线，理解自然环境对长征行军的影响。',col:['#7d999d','#283b36'],date:'1935年春季，中央红军长征途中',core:'红军翻越高海拔雪山时，面对低温、缺氧、道路险峻等困难。具体山名、日期、部队和个体故事应逐项核对权威史料。',learn:['自然地理会影响行军速度、队伍组织与补给安排。','回忆录、口述故事和文学作品需要辨明来源与写作背景。','程序生成的山体不是实地测绘，不能当作历史证据。'],task:'指出场景中两处程序生成的视觉元素，并说明它们为什么不能作为史实证据。',q:'雪山场景是否属于真实历史现场的精确复原？',opts:['是，画面可以直接证明历史细节','不是，场景是教学模拟，史实需要文献支持'],a:1,src:'建议核验中央党史和文献研究院相关党史资料、《中国工农红军第一方面军长征史》等军史出版物。'},
{id:'grass',n:'穿越草地',en:'CHAPTER 02 · GRASSLAND',d:'低云、湿地与漫长行军构成严峻考验。天气与草甸均为程序模拟。',col:['#87998d','#293b31'],date:'1935年，红军长征途中',core:'红军穿越草地时面临湿地、气候、补给和体力等挑战。不同部队、不同时间段的路线与经历有差异，不能将所有故事简单合并。',learn:['环境挑战应放在具体路线和时间背景中理解。','人数、伤亡、行程天数等数字必须附来源并交叉核对。','场景中的水面、雾气、草甸均为程序模拟。'],task:'选出写入课程作业前最应该完成的核验步骤。',q:'引用具体数字或故事时，最稳妥的做法是什么？',opts:['采用转发最多的文章即可','查权威来源、交叉核对，并记录出处'],a:1,src:'建议核验权威党史、军史著作及相关纪念馆公开展陈资料。'},
{id:'river',n:'强渡大渡河',en:'CHAPTER 03 · DADU RIVER',d:'河流与渡口影响路线和时间。观察两岸地形，思考渡河行动中的地理与组织问题。',col:['#829a98','#203b45'],date:'1935年5月，大渡河地区',core:'中央红军向大渡河地区推进，渡河点与两岸地形影响行动路线和时间。具体战斗经过、部队番号及人物细节应结合权威党史、军史材料核对。',learn:['地形观察能帮助提出问题，但不能单凭模型推断历史决策。','把地图、时间线、部队行动与文献互相对照。','当前河流宽度、岸线和水流均为艺术化模拟。'],task:'说明地形观察与史料核验分别能回答什么问题。',q:'仅凭本关河流模型，能否推断历史渡河点的准确位置？',opts:['能，模型已经精确还原','不能，需查地图与权威史料交叉核验'],a:1,src:'建议核验中央红军长征相关党史、军史出版物及权威地图。'},
{id:'bridge',n:'飞夺泸定桥',en:'CHAPTER 04 · LUDING BRIDGE',d:'峡谷风声穿过铁链。辨认模拟场景和可核验史实的边界。',col:['#7b8985','#202c29'],date:'1935年5月29日',core:'中央红军飞夺泸定桥是长征进程中的重要事件。战斗细节、参战人数、队伍番号和具体过程应以权威党史、军史出版物及纪念馆资料为依据。',learn:['事件日期和基本意义可作为学习入口，细节仍要追溯出处。','影视化桥梁、人物动作、天气和镜头语言不是史料。','本关桥体是游戏化示意，不是历史现场扫描。'],task:'将“史实”和“程序模拟”各举一例，并说明判断依据。',q:'哪项更符合史料使用规范？',opts:['用游戏画面证明桥梁当时的具体外观','把可核验信息与虚拟桥景明确分开'],a:1,src:'建议核验泸定桥相关纪念馆公开资料及权威党史军史出版物。'},
{id:'zunyi',n:'遵义会议',en:'CHAPTER 05 · ZUNYI',d:'聚焦会议背景、主要内容及历史意义。',col:['#9b8970','#33271f'],date:'1935年1月',core:'遵义会议在长征途中召开，具有重要历史意义。学习时应关注会议背景、主要内容和对中国革命进程的影响，并以正式党史文献为依据。',learn:['不要把后来的总结性表述误当成会议现场逐字记录。','会址、会议桌和室内陈设是概念化布景。','会议内容和历史评价应引用权威出版物。'],task:'解释为什么概念化会议室不能代替正式党史文献。',q:'哪种证据更适合支撑对会议内容的判断？',opts:['程序生成的会议室布景','正式党史文献、可靠史料及权威研究'],a:1,src:'建议核验中央党史和文献研究院资料及遵义会议纪念馆权威展陈。'},
{id:'north',n:'走向陕北',en:'CHAPTER 06 · NORTHERN SHAANXI',d:'结合时间线梳理长征进程。不同红军部队的路线与经历并不完全相同。',col:['#a18f71','#35392e'],date:'1935年长征进程及其后续阶段',core:'长征涉及不同红军部队和不同路线，行程、会师时间与经历并不完全相同。学习时应区分中央红军及其他红军队伍的历史脉络。',learn:['不要把不同队伍的路线拼成一条完全相同的路线。','地图连线是教学导航，实际路线需依据可靠历史地图核对。','本关地貌是陕北意象，不是某一地点的精确复原。'],task:'说明为什么课程地图需要标注部队、时间和资料来源。',q:'学习长征路线时，为什么要区分不同红军部队？',opts:['因为各部队路线和经历并不完全相同','没有必要，所有队伍走的是完全相同路线'],a:0,src:'建议核验各路红军长征相关党史、军史著作及权威历史地图。'}
];

function draw(){let d=Math.min(devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight;if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);let c=C[cur],g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,c.col[0]);g.addColorStop(1,c.col[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

if(cur===0||cur===5){for(let i=0;i<18;i++){let x=i*97%w,y=h*(.36+(i%4)*.025);ctx.fillStyle=['#34453e','#4d5d52','#69776b'][i%3];ctx.beginPath();ctx.moveTo(x-100,h);ctx.lineTo(x,y+Math.sin(i+t)*5);ctx.lineTo(x+100,h);ctx.fill();ctx.fillStyle='#d5ded5';ctx.beginPath();ctx.moveTo(x-27,y+30);ctx.lineTo(x,y+Math.sin(i+t)*5);ctx.lineTo(x+28,y+30);ctx.fill()}}
else if(cur===1){ctx.fillStyle='#4b5a45';ctx.fillRect(0,h*.56,w,h*.44);for(let i=0;i<80;i++){ctx.fillStyle=i%2?'#8c9770':'#687b5d';ctx.beginPath();ctx.ellipse(i*83%w,h*.58+(i*43%(h*.4)),20,5,0,0,7);ctx.fill()}}
else if(cur===2){ctx.fillStyle='#4b6159';ctx.beginPath();ctx.moveTo(0,h*.3);ctx.lineTo(w*.4,h*.44);ctx.lineTo(w*.7,h*.32);ctx.lineTo(w,h*.25);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle='#315e69';ctx.beginPath();ctx.moveTo(w*.27,h*.45);ctx.quadraticCurveTo(w*.5,h*.55,w*.42,h);ctx.lineTo(w*.66,h);ctx.quadraticCurveTo(w*.6,h*.6,w*.72,h*.42);ctx.fill()}
else if(cur===3){ctx.fillStyle='#34413a';ctx.fillRect(0,h*.48,w,h*.52);ctx.strokeStyle='#c3a976';ctx.lineWidth=4;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(w*.22,h*.47+i*12);ctx.quadraticCurveTo(w*.5,h*.72+i*8,w*.78,h*.47+i*12);ctx.stroke()}ctx.strokeStyle='#8f795a';ctx.lineWidth=2;for(let i=0;i<23;i++){ctx.beginPath();ctx.moveTo(w*.23+i*w*.54/22,h*.48);ctx.lineTo(w*.23+i*w*.54/22,h*.67);ctx.stroke()}}
else{ctx.fillStyle='#414238';ctx.fillRect(0,h*.63,w,h*.37);ctx.fillStyle='#70533a';ctx.fillRect(w*.23,h*.3,w*.54,h*.37);ctx.fillStyle='#a0835d';ctx.fillRect(w*.19,h*.28,w*.62,h*.05);for(let i=0;i<4;i++){ctx.fillStyle='#c1a37d';ctx.fillRect(w*(.3+i*.12),h*.4,w*.06,h*.13)}}
ctx.strokeStyle='#e7bd73';ctx.lineWidth=3;ctx.setLineDash([8,9]);ctx.beginPath();ctx.moveTo(w*.15,h*.72);ctx.bezierCurveTo(w*.35,h*.56,w*.53,h*.82,w*.78,h*.58);ctx.stroke();ctx.setLineDash([]);let x=w*(.5+Math.sin(t*.5)*.035),y=h*.58+Math.sin(t*2)*5;ctx.fillStyle='#f3cb7b';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.strokeStyle='#f3cb7b99';ctx.beginPath();ctx.arc(x,y,16+Math.sin(t*2)*3,0,7);ctx.stroke();if(cur===0){ctx.fillStyle='#ffffffaa';for(let i=0;i<65;i++)ctx.fillRect((i*137+t*18)%w,(i*61+t*50)%h,2,2)}t+=.01;requestAnimationFrame(draw)}
function open(type){let c=C[cur],s='';if(type==='brief')s=`<div class="small">SCENE NOTE / 场景说明</div><h2>${c.n}</h2><span class="tag">程序生成的教学模拟</span><span class="tag">非历史现场复原</span><p>${c.d}</p><p>地形、天气、建筑和道具用于帮助建立空间印象，不是实地测绘，也不能作为历史证据。</p><div class="fact">观察：地形与空间<br>阅读：历史摘要与来源<br>判断：史实还是模拟</div>`;

if(type==='task')s=`<div class="small">MISSION / 本关学习任务</div><h2>${c.n} · 任务简报</h2><p>${c.task}</p><div class="fact"><b>判断题</b><p>${c.q}</p><div class="task">${c.opts.map((o,i)=>`<button data-q="${i}">${i+1}. ${o}</button>`).join('')}</div><div id="result"></div></div>`;
if(type==='journal')s=`<div class="small">FIELD JOURNAL / 学习记录</div><h2>行军手记</h2><p>学习进度保存在当前浏览器；清理浏览器数据后可能丢失。</p><div class="fact">已完成：${prog.done.length}/6　已答题：${Object.keys(prog.answers).length}</div>${C.map(x=>`<div class="fact">${prog.done.includes(x.id)?'✓':'○'} ${x.n}</div>`).join('')}<h3>最近记录</h3>${prog.notes.slice(-10).reverse().map(x=>`<div class="fact"><b>${x.a}</b><p>${x.b}</p><small>${x.when}</small></div>`).join('')||'<p>完成任务后会在这里显示记录。</p>'}<button class="btn" id="reset">重置本机学习进度</button>`;
